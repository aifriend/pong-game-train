name: Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.8 and 3.9 are past end of life and current torch does not ship
        # wheels for them, so the project is tested on 3.10 and newer.
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      # The project declares its dependencies in pyproject.toml; there is no
      # requirements.txt since the migration to uv.
      run: uv sync --extra dev --python ${{ matrix.python-version }}

    - name: Lint with flake8
      run: |
        # .venv holds installed third-party code; flake8 does not exclude it by
        # default, and scanning it would trip the syntax gate below.
        # Stop the build if there are Python syntax errors or undefined names
        uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --extend-exclude=.venv
        # Exit-zero treats all errors as warnings
        uv run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --extend-exclude=.venv

    - name: Check code formatting with black
      run: uv run black --check pong/ scripts/ tests/

    - name: Run tests with pytest
      run: uv run --with pytest-cov pytest tests/ -v --cov=pong --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      # Coverage reporting is informational, not a correctness gate, so a
      # failed upload must not fail the build.
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      continue-on-error: true
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
